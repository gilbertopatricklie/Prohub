services:
  postgres:
    image: postgres:16
    container_name: producthub-postgres
    env_file:
      - ./env/.postgres.env
    ports:
      - "5234:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: producthub-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]

volumes:
  postgres_data:
  redis_data: